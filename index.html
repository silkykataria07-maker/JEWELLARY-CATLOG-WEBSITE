<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jewellery Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Elegant Jewellery</h1>
    <p>Discover timeless beauty</p>
</header>

<!-- METAL CATEGORIES -->
<section class="menu">
    <button onclick="showCategory('gold')">Gold</button>
    <button onclick="showCategory('silver')">Silver</button>
    <button onclick="showCategory('diamond')">Diamond</button>
    <button onclick="showCategory('platinum')">Platinum</button>
    <button onclick="showCategory('copper')">Copper</button>
</section>

<!-- JEWELLERY TYPES -->
<section id="types" class="menu hidden">
    <button onclick="showProducts()">Rings</button>
    <button>Earrings</button>
    <button>Necklace</button>
    <button>Bracelets</button>
</section>

<!-- PRODUCTS -->
<section id="products" class="catalog hidden">

    <div class="item">
        <img src="images/ring.webp" alt="Ring">
        <h3>Gold Ring</h3>
        <p>₹25,000</p>
        <button onclick="addToCart('Gold Ring', 25000)">Add to Cart</button>
    </div>

    <div class="item">
        <img src="images/ring.webp" alt="Ring">
        <h3>Designer Ring</h3>
        <p>₹30,000</p>
        <button onclick="addToCart('Designer Ring', 30000)">Add to Cart</button>
    </div>

</section>

<!-- CART -->
<section class="cart">
    <h2>🛒 Cart</h2>
    <ul id="cart-items"></ul>
    <h3>Total: ₹<span id="total">0</span></h3>
</section>

<script src="script.js"></script>
</body>
</html>
